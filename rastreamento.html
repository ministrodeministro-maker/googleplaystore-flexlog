<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rastrear encomenda | FlexLog</title><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#061b33"><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#061c34;color:#fff}header{background:#c9d7e0;padding:18px max(5%,20px);display:flex;align-items:center;justify-content:space-between;color:#071c32}header a{color:inherit;text-decoration:none;font-weight:800;font-size:27px}.brand{display:flex;align-items:center;gap:14px}.brand img{width:56px;height:56px;object-fit:contain}.menu{font-size:32px}main{max-width:760px;margin:0 auto;padding:55px 20px}.tag{display:inline-block;border:1px solid #23617b;border-radius:30px;background:#103e56;padding:12px 20px;color:#58c7e8;font-weight:700}h1{font-size:clamp(34px,6vw,58px);line-height:1.13;margin:35px 0 22px}p.lead{color:#b9c9d9;font-size:21px;line-height:1.5}.form{margin:40px 0;display:flex;gap:12px;flex-wrap:wrap}.form input{flex:1;min-width:180px;padding:19px;border-radius:12px;border:1px solid #7693a7;font-size:18px}.form button{background:#1ba9db;color:white;font-size:18px;font-weight:700;padding:18px 30px;border:0;border-radius:12px;cursor:pointer}.card{background:white;color:#102033;border-radius:30px;padding:clamp(25px,6vw,48px);margin-top:25px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:24px}.muted{color:#68747b;font-size:17px}.value{font-size:23px;font-weight:700;margin-top:10px;overflow-wrap:anywhere}.status{display:inline-block;background:#e3f7fc;color:#1699bd;padding:12px 18px;border-radius:40px;font-weight:700;margin:14px 0}.route{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;text-align:center;margin:30px 0}.route strong{display:block;margin-top:12px;overflow-wrap:anywhere}.steps{border-top:1px solid #d5e0e6;padding-top:28px}.step{border-left:3px solid #cdd9e0;padding:0 0 34px 25px;margin-left:10px;position:relative}.step:before{content:'';position:absolute;left:-10px;top:0;width:15px;height:15px;border:3px solid #cdd9e0;border-radius:50%;background:white}.step.active{border-color:#28afd2}.step.active:before{border-color:#28afd2;background:#28afd2}.step strong{font-size:20px}.step p{color:#75818a;line-height:1.6}#message{color:#ffcc9d}footer{padding:20px;text-align:center;color:#9ab1c5}@media(max-width:450px){.route{font-size:13px;gap:6px}.route strong{font-size:14px}.value{font-size:19px}.form button{width:100%}}
</style></head><body><header><div class="brand"><img src="flexlog%20logo/logo.jpg" alt="FlexLog"><a href="/">FlexLog</a></div><a href="/" aria-label="Início" class="menu">☰</a></header><main><div class="tag">● Especialistas em carga refrigerada</div><h1>Rastrear encomenda</h1><p class="lead">Consulte o andamento da sua entrega pelo código de rastreio.</p><form id="form" class="form"><input id="codigo" required maxlength="70" placeholder="Digite o código de rastreio" aria-label="Código de rastreio"><button>Rastrear encomenda</button></form><p id="message" role="status"></p><section id="resultado" class="card" hidden></section></main><footer>FlexLog Transportadora • Rastreamento de encomendas</footer><script>
const params=new URLSearchParams(location.search);const input=document.getElementById('codigo');input.value=params.get('codigo')||'';
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const code=input.value.trim();const msg=document.getElementById('message'),out=document.getElementById('resultado');out.hidden=true;msg.textContent='Consultando...';try{const r=await fetch('rastreamentos.json',{cache:'no-store'});if(!r.ok)throw Error('Dados indisponíveis');const db=await r.json();const item=db[code]||db[code.toUpperCase()];if(!item){msg.textContent='Código não encontrado. Confira o código e tente novamente.';return}msg.textContent='';const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stages=Array.isArray(item.etapas)?item.etapas:[];out.innerHTML='<div class="summary"><div><div class="muted">Código de rastreio</div><div class="value">'+escape(code)+'</div></div><div><div class="muted">Transportadora</div><div class="value">FlexLog</div></div></div><p class="muted" style="margin-top:35px">Status atual</p><div class="status">● '+escape(item.status)+'</div><div class="steps"><div class="route"><div><span class="muted">Origem</span><strong>'+escape(item.origem)+'</strong></div><div><span class="muted">Status atual</span><strong>'+escape(item.status)+'</strong></div><div><span class="muted">Destino</span><strong>'+escape(item.destino)+'</strong></div></div>'+stages.map((s,i)=>'<div class="step '+(s.concluida||s.atual?'active':'')+'"><strong>'+escape(s.titulo)+'</strong><p>'+escape(s.descricao)+'</p></div>').join('')+'</div>';out.hidden=false;history.replaceState(null,'','?codigo='+encodeURIComponent(code));}catch(err){msg.textContent='Não foi possível consultar os rastreamentos no momento.';}});
if(input.value)document.getElementById('form').requestSubmit();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');</script></body></html>
