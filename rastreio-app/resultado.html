<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061b33"><title>Rastreamento | FlexLog</title><style>*{box-sizing:border-box}body{margin:0;background:#061b33;color:#0b2438;font-family:Arial,system-ui,sans-serif}header{background:#c9d6e0;display:flex;align-items:center;justify-content:space-between;padding:19px max(5%,20px)}.brand{display:flex;align-items:center;gap:15px;font-size:28px;font-weight:800}.brand img{width:52px;height:52px;object-fit:contain}header a{text-decoration:none;color:#10283a;font-size:28px}main{max-width:760px;margin:0 auto;padding:14px 20px 45px}.card{background:#fff;border-radius:32px 32px 8px 8px;padding:clamp(24px,6vw,46px);min-height:70vh}.summary{display:grid;grid-template-columns:1fr 1fr;gap:20px}.muted{color:#74818a;font-size:16px}.value{font-size:clamp(19px,4vw,26px);font-weight:800;margin-top:14px;overflow-wrap:anywhere}.status-label{margin-top:46px}.status{display:inline-block;background:#e5f7fb;color:#22a5c4;font-size:19px;font-weight:800;padding:12px 17px;border-radius:40px;margin:13px 0 30px}.rule{border:0;border-top:1px solid #d9e3e8;margin:10px 0 42px}.route{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:9px;text-align:center;margin:0 0 60px}.route strong{display:block;font-size:clamp(16px,3.8vw,22px);line-height:1.45;margin-top:14px;overflow-wrap:anywhere}.arrow{color:#bdcbd3}.steps{margin-left:12px}.step{border-left:3px solid #dce6eb;padding:0 0 34px 28px;position:relative}.step:before{content:'';position:absolute;left:-11px;top:0;width:17px;height:17px;background:#fff;border:3px solid #cbd9e0;border-radius:50%}.step.active{border-color:#45b4d0}.step.active:before{background:#3cb3d1;border-color:#3cb3d1;box-shadow:0 0 0 5px #dff4fa}.step strong{font-size:19px}.step p{font-size:17px;line-height:1.55;color:#72808b;margin:9px 0 0}.demo{font-size:12px;color:#667e8e;margin-top:15px}.back{display:block;color:#daf4ff;text-align:center;padding:20px;font-weight:700;text-decoration:none}.error{color:#ad2828;font-weight:700}@media(max-width:420px){.summary{gap:10px}.route{gap:5px}.route strong{font-size:15px}.muted{font-size:13px}.status{font-size:16px}.step strong{font-size:17px}}</style></head><body><header><div class="brand"><img src="/logo.jpg" alt="FlexLog"><span>FlexLog</span></div><a href="/" aria-label="Voltar ao rastreamento">☰</a></header><main><section id="result" class="card"><p>Consultando...</p></section><a class="back" href="/">Consultar outro código</a></main><script>
(async()=>{const code=(new URLSearchParams(location.search).get('codigo')||'').trim().toUpperCase();const out=document.getElementById('result');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!/^[A-Z0-9-]{3,70}$/.test(code)){out.innerHTML='<p class="error">Código inválido. Volte e digite um código de rastreio.</p>';return}try{const response=await fetch('/rastreamentos.json',{cache:'no-store'});if(!response.ok)throw Error('indisponível');const db=await response.json();const item=db[code];if(!item){out.innerHTML='<p class="error">Código não cadastrado. Para testar o exemplo, use BR35318887.</p>';return}const stages=Array.isArray(item.etapas)?item.etapas:[];out.innerHTML='<div class="summary"><div><div class="muted">Código de rastreio</div><div class="value">'+esc(code)+'</div></div><div><div class="muted">Transportadora</div><div class="value">FlexLog</div></div></div><div class="muted status-label">Status atual</div><div class="status">● '+esc(item.status)+'</div><hr class="rule"><div class="route"><div><span class="muted">Origem</span><strong>'+esc(item.origem)+'</strong></div><span class="arrow">→</span><div><span class="muted">Status atual</span><strong>'+esc(item.status)+'</strong></div><span class="arrow">→</span><div><span class="muted">Destino</span><strong>'+esc(item.destino)+'</strong></div></div><div class="steps">'+stages.map(s=>'<div class="step '+(s.atual?'active':'')+'"><strong>'+esc(s.titulo)+'</strong><p>'+esc(s.descricao)+'</p></div>').join('')+'</div><p class="demo">Exemplo de acompanhamento — informações fictícias para demonstração.</p>'}catch(e){out.innerHTML='<p class="error">Não foi possível carregar a demonstração.</p>'}})();
</script></body></html>
