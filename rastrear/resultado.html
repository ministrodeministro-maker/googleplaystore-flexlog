<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071c34"><title>Situação da nota fiscal | FlexLog Transportadora</title><style>*{box-sizing:border-box}body{margin:0;background:#071c34;color:#f6fbff;font-family:system-ui,-apple-system,Arial,sans-serif}header{display:flex;align-items:center;gap:12px;padding:19px 22px;background:#102b48;border-bottom:1px solid #23445f}header img{width:48px;height:48px;object-fit:contain;border-radius:10px}header strong{font-size:23px}main{max-width:660px;margin:0 auto;padding:42px 20px 70px}.eyebrow{display:inline-block;border:1px solid #29637b;color:#71d5ef;background:#0d344d;padding:9px 15px;border-radius:50px;font-size:13px;font-weight:700}h1{font-size:clamp(32px,7vw,48px);line-height:1.12;margin:24px 0 15px}p{line-height:1.55;color:#bbcede}.panel{background:#fff;color:#102940;border-radius:22px;padding:25px;margin-top:28px;box-shadow:0 15px 45px #0003}.panel p{color:#516579}label{display:block;font-weight:700;margin-bottom:11px}input{width:100%;border:1px solid #9eb0bd;border-radius:12px;padding:17px;font-size:18px;outline-offset:2px;text-transform:uppercase}button,.action{display:block;width:100%;text-align:center;border:0;border-radius:12px;padding:17px 20px;background:#08a5d4;color:white;font-weight:800;font-size:17px;text-decoration:none;cursor:pointer;margin-top:17px}.secondary{background:#edf5fa;color:#16425e}.hint{font-size:13px;margin-top:15px}.notice{border-left:3px solid #6fcce4;padding:12px 15px;background:#123650;border-radius:8px;color:#d3e5ef;font-size:14px;margin-top:24px}.status{display:inline-block;border-radius:40px;background:#e5f7fc;color:#087e9e;font-weight:800;padding:12px 16px;margin:10px 0 20px}.muted{font-size:13px;color:#687a89!important}.field{padding:15px 0;border-bottom:1px solid #e6edf1}.field strong{display:block;margin-top:5px;overflow-wrap:anywhere}.error{color:#b62929!important;font-weight:700}footer{text-align:center;color:#8da8bd;padding:30px 15px;font-size:13px}</style></head><body><header><img src="/flexlog%20logo/logo.jpg" alt="Logo FlexLog"><strong>FlexLog</strong></header><main><span class="eyebrow">RESULTADO DA CONSULTA</span><h1>Situação da encomenda</h1><p>Informações disponíveis para o código consultado.</p><section class="panel" id="result"><p>Consultando...</p></section><a class="action secondary" href="/rastrear/">Consultar outro código</a><div class="notice">Resultado demonstrativo. Não comprova a existência de uma encomenda ou a emissão de uma nota fiscal.</div></main><footer>FlexLog Transportadora • Consulta demonstrativa</footer><script>
(async()=>{const code=(new URLSearchParams(location.search).get('codigo')||'').trim().toUpperCase();const out=document.getElementById('result');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!/^[A-Z0-9-]{3,70}$/.test(code)){out.innerHTML='<p class="error">Código inválido. Volte e digite um código de rastreio.</p>';return}try{const response=await fetch('/rastreamentos.json',{cache:'no-store'});if(!response.ok)throw Error('indisponível');const db=await response.json();const item=db[code];if(!item){out.innerHTML='<p class="error">Código não cadastrado nesta demonstração.</p><p>Para testar, use BR35318887. Nenhum status real foi consultado.</p>';return}out.innerHTML='<p class="muted">Código de rastreamento</p><h2>'+esc(code)+'</h2><p class="muted">Status apresentado no exemplo</p><div class="status">'+esc(item.status)+'</div><div class="field"><span class="muted">Origem</span><strong>'+esc(item.origem)+'</strong></div><div class="field"><span class="muted">Destino</span><strong>'+esc(item.destino)+'</strong></div><div class="field"><span class="muted">Próxima etapa (exemplo)</span><strong>Nota fiscal emitida</strong></div><p class="hint">Esta situação é fictícia e serve apenas para demonstrar o visual do aplicativo.</p>'}catch(e){out.innerHTML='<p class="error">Não foi possível consultar os dados de demonstração.</p>'}})();
</script></body></html>
